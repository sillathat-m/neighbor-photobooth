<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neighbor Photobooth Kiosk (80mm)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Kanit', sans-serif;
            background-color: #FAF8F5;
            color: #111; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
            background-color: #FAF8F5;
        }
        .screen.active { display: flex; }

        /* --- หน้าจอ Idle --- */
        #screen-idle { cursor: pointer; }
        .idle-title { font-family: 'Playfair Display', serif; font-size: 56px; color: #111; margin-bottom: 20px; line-height: 1.1; }
        .idle-title span { font-style: italic; font-weight: normal; font-size: 40px; }
        .idle-animation-box {
            width: 120px; height: 200px; overflow: hidden; margin: 30px auto; border: 2px solid #ccc;
            background: white; padding: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .film-strip { display: flex; flex-direction: column; gap: 5px; animation: scrollFilm 4s linear infinite; }
        .film-strip div { width: 100%; height: 80px; background-color: #ddd; border-radius: 4px; }
        @keyframes scrollFilm { 0% { transform: translateY(0); } 100% { transform: translateY(-170px); } }
        .pulse-text { font-size: 20px; color: #555; animation: pulse 1.5s infinite; margin-top: 40px; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        /* --- หน้าเลือก Layout --- */
        #screen-home h1 { font-family: 'Playfair Display', serif; font-size: 42px; color: #111; margin-bottom: 5px; }
        #screen-home p { font-size: 18px; color: #555; margin-bottom: 20px; font-weight: 300; }
        
        .carousel-container {
            width: 100%; max-width: 900px; overflow-x: auto; scroll-snap-type: x mandatory;
            display: flex; gap: 20px; padding: 20px; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar { display: none; }
        
        .frame-card {
            scroll-snap-align: center; flex: 0 0 auto;
            background: #fff; border: 2px solid #eaeaea; border-radius: 20px;
            width: 280px; padding: 20px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            transition: 0.2s;
        }
        .frame-card:active { transform: scale(0.95); border-color: #111; }
        
        .frame-png-preview {
            width: 100%; max-width: 240px; height: 350px; 
            object-fit: contain; margin: 0; 
            filter: drop-shadow(2px 5px 12px rgba(0,0,0,0.1));
        }

        .mini-preview {
            width: 160px; height: 220px; background: #fff; border: 2px solid #ddd;
            margin: 0; position: relative; display: flex; flex-direction: column; align-items: center;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.05);
        }
        .mini-preview .box { background: #f4f4f4; border: 1px solid #e0e0e0; }
        .mini-ig { padding-top: 45px; } .mini-ig::before { content: ''; position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; border-radius: 50%; background: #ccc; } .mini-ig .box { width: 140px; height: 120px; margin-top: 5px; }
        .mini-strip { height: 260px; justify-content: space-evenly; padding: 8px 0; } .mini-strip .box { width: 110px; height: 75px; }
        .mini-polaroid { padding: 12px; padding-bottom: 50px; } .mini-polaroid .box { width: 100%; height: 100%; }
        .mini-hw { border-color: #FF9800; background: #FFF9F0; justify-content: space-evenly; padding: 8px 0; height: 250px;} .mini-hw::after { content: '🎃'; position: absolute; bottom: 5px; right: 8px; font-size: 30px; } .mini-hw::before { content: '🦇'; position: absolute; top: 5px; left: 8px; font-size: 26px; } .mini-hw .box { width: 110px; height: 85px; border-color: #FFCC80; }

        /* --- หน้ากล้องถ่ายรูป --- */
        /* ปรับปรุงโครงสร้างหน้าจอถ่ายรูปใหม่ ให้เห็นสัดส่วนภาพที่แท้จริง */
        .live-preview-container {
            position: relative; 
            width: 100%; 
            max-width: 400px; /* จำกัดความกว้างให้พอดีหน้าจอโทรศัพท์/แท็บเล็ตแนวตั้ง */
            margin: 0 auto;
            border: 2px solid #ccc;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            /* เราจะใช้ JS คำนวณความสูง (aspect ratio) ให้ตรงกับกรอบที่เลือก */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* วิดีโอจะถูกขยายให้เต็มกรอบ Container นี้เสมอ */
        #camera { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* ครอปส่วนที่เกินทิ้ง เพื่อให้เต็มจอเสมอ */
            transform: scaleX(-1); 
            z-index: 1;
        }

        /* รูป PNG กรอบ จะมาซ้อนทับวิดีโอ */
        #frameOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: fill; /* ให้ยืดพอดีกรอบ 100% */
            z-index: 2; /* อยู่เหนือวิดีโอ */
            pointer-events: none; /* ไม่ให้คลิกโดน */
            display: none;
        }

        #countdownOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center;
            font-size: 150px; font-family: 'Playfair Display', serif; font-weight: bold; color: white;
            text-shadow: 0px 5px 20px rgba(0,0,0,0.8); z-index: 10;
        }

        #statusText { font-size: 24px; color: #111; margin: 20px 0; height: 35px; }
        .btn-main { background-color: #111; color: white; border: none; padding: 15px 40px; font-size: 22px; font-family: 'Kanit', sans-serif; border-radius: 40px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .btn-main:active { transform: scale(0.95); }

        /* --- หน้าพรีวิว --- */
        .preview-container {
            width: 100%; max-width: 400px; height: 50vh; overflow-y: auto;
            border: 2px solid #ccc; background: white; border-radius: 10px; margin-bottom: 15px;
        }
        #receiptCanvas { width: 100%; display: block; }
        
        .copies-control {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            margin-bottom: 15px; background: #fff; padding: 10px 20px; border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 20px; font-weight: 600; border: 2px solid #eee;
        }
        .btn-copy {
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid #111; background: white;
            font-size: 26px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-copy:active { background: #111; color: white; }

        .action-btns { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; max-width: 400px; }
        .btn-action { flex: 1; padding: 15px; font-size: 20px; border-radius: 15px; border: none; cursor: pointer; color: white; font-family: 'Kanit', sans-serif; font-weight: 600; }
        .btn-retake { background-color: #999; }
        .btn-print { background-color: #4CAF50; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3); }
        .btn-done { background-color: #111; min-width: 100%; }

    </style>
</head>
<body>

    <!-- Screen 0: Idle -->
    <div id="screen-idle" class="screen active" onclick="startApp()">
        <div class="idle-title"><span>neighbor</span><br>PHOTOBOOTH</div>
        <div class="idle-animation-box">
            <div class="film-strip">
                <div style="background:#555;"></div><div style="background:#888;"></div>
                <div style="background:#bbb;"></div><div style="background:#555;"></div>
            </div>
        </div>
        <div class="pulse-text">แตะหน้าจอเพื่อเริ่มต้น</div>
    </div>

    <!-- Screen 1: Home -->
    <div id="screen-home" class="screen">
        <h1>Choose Frame</h1>
        <p>เลื่อนซ้ายขวา เพื่อเลือกกรอบรูปที่คุณต้องการ</p>
        
        <div class="carousel-container">
            <div class="frame-card" onclick="selectLayout('ig')">
                <img src="f3.png" class="frame-png-preview" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="mini-preview mini-ig" style="display:none;"><div class="box"></div></div>
            </div>

            /*<div class="frame-card" onclick="selectLayout('strip3')">
                <img src="frame-strip.png" class="frame-png-preview" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="mini-preview mini-strip" style="display:none;"><div class="box"></div><div class="box"></div><div class="box"></div></div>
            </div>

            <div class="frame-card" onclick="selectLayout('polaroid')">
                <img src="frame-polaroid.png" class="frame-png-preview" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="mini-preview mini-polaroid" style="display:none;"><div class="box"></div></div>
            </div>

            <div class="frame-card" onclick="selectLayout('halloween')">
                <img src="frame-halloween.png" class="frame-png-preview" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="mini-preview mini-hw" style="display:none;"><div class="box"></div><div class="box"></div></div>
            </div>*/
        </div>
    </div>

    <!-- Screen 2: Camera -->
    <div id="screen-camera" class="screen">
        
        <!-- Live Preview Container ที่ปรับขนาดตามกรอบ -->
        <div id="livePreviewBox" class="live-preview-container">
            <!-- กล้อง -->
            <video id="camera" autoplay playsinline></video>
            <!-- รูปภาพกรอบซ้อนทับ -->
            <img id="frameOverlay" src="">
            <!-- นับถอยหลัง -->
            <div id="countdownOverlay"></div>
        </div>

        <div id="statusText">เตรียมตัวให้พร้อม...</div>
        <button id="startCaptureBtn" class="btn-main" onclick="startCaptureSequence()">📸 กดเพื่อถ่ายรูป</button>
    </div>

    <!-- Screen 3: Preview -->
    <div id="screen-preview" class="screen">
        <div class="preview-container">
            <canvas id="receiptCanvas" width="576"></canvas>
        </div>
        
        <div class="copies-control">
            <span>จำนวนแผ่น:</span>
            <button class="btn-copy" onclick="changeCopies(-1)">-</button>
            <span id="printCopies" style="width: 30px; text-align: center;">1</span>
            <button class="btn-copy" onclick="changeCopies(1)">+</button>
        </div>

        <div class="action-btns">
            <button class="btn-action btn-retake" onclick="resetToHome()">ถ่ายใหม่</button>
            <button class="btn-action btn-print" onclick="printReceipt()">🖨️ ปริ้นรูปภาพ</button>
            <button class="btn-action btn-done" onclick="goToIdle()">✅ เสร็จสิ้น (กลับหน้าแรก)</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('receiptCanvas');
        const ctx = canvas.getContext('2d');
        const countdownEl = document.getElementById('countdownOverlay');
        const statusText = document.getElementById('statusText');
        const startCaptureBtn = document.getElementById('startCaptureBtn');
        const livePreviewBox = document.getElementById('livePreviewBox');
        const frameOverlay = document.getElementById('frameOverlay');
        
        let currentLayout = '';
        let audioCtx;
        let printCopyCount = 1; 
        let videoStream = null;

        const layoutConfigs = {
            'ig': {
                width: 576, height: 900, photos: [{x: 0, y: 110, w: 576, h: 576}],
                useCustomPng: true, pngUrl: 'f3.png' 
            },
            'strip3': {
                width: 576, height: 1900, 
                photos: [{x: 48, y: 180, w: 480, h: 480}, {x: 48, y: 720, w: 480, h: 480}, {x: 48, y: 1260, w: 480, h: 480}],
                useCustomPng: true, pngUrl: 'frame-strip.png' 
            },
            'polaroid': {
                width: 576, height: 800, photos: [{x: 48, y: 60, w: 480, h: 480}],
                useCustomPng: true, pngUrl: 'frame-polaroid.png' 
            },
            'halloween': {
                width: 576, height: 1400, photos: [{x: 48, y: 200, w: 480, h: 480}, {x: 48, y: 740, w: 480, h: 480}],
                useCustomPng: true, pngUrl: 'frame-halloween.png' 
            }
        };

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playBeep(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'tick') { osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); gain.gain.setValueAtTime(0.5, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.1); } 
            else if (type === 'snap') { osc.type = 'square'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
        }

        async function initCamera() {
            if (videoStream) return; // ถ่ายอยู่แล้ว ไม่ต้องเปิดซ้ำ
            try { 
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }); 
                video.srcObject = videoStream;
            } 
            catch (err) { 
                try { 
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: true }); 
                    video.srcObject = videoStream;
                } catch (e) { console.log("Camera error"); } 
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startApp() { initAudio(); initCamera(); showScreen('screen-home'); }

        async function selectLayout(layout) {
            initAudio(); 
            currentLayout = layout;
            const config = layoutConfigs[currentLayout];
            
            // 1. คำนวณ Aspect Ratio เพื่อบีบ/ขยายกรอบจอพรีวิวให้เหมือนกระดาษจริง
            const aspectRatio = config.width / config.height;
            // ล็อกความสูงหน้าจอพรีวิวไว้ที่ 60vh (ไม่ให้เกินหน้าจอ) แล้วคำนวณกว้างตามสัดส่วน
            livePreviewBox.style.height = '60vh'; 
            livePreviewBox.style.width = `calc(60vh * ${aspectRatio})`;
            
            // 2. นำรูป PNG มาแปะทับกล้องสดๆ
            if (config.useCustomPng) {
                frameOverlay.src = config.pngUrl;
                frameOverlay.style.display = 'block';
                // ดักจับ error ถ้ารูปไม่มี
                frameOverlay.onerror = function() { this.style.display = 'none'; };
            } else {
                frameOverlay.style.display = 'none';
            }
            
            showScreen('screen-camera');
            startCaptureBtn.style.display = 'block';
            statusText.innerText = "จัดท่าทางให้พร้อม แล้วกดเริ่ม!";
        }

        async function startCaptureSequence() {
            initAudio(); startCaptureBtn.style.display = 'none'; 
            
            const config = layoutConfigs[currentLayout];
            canvas.height = config.height;
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (!config.useCustomPng) { drawBackgroundTemplate(currentLayout); }

            for (let i = 0; i < config.photos.length; i++) {
                statusText.innerText = `ถ่ายรูปที่ ${i+1} / ${config.photos.length}`;
                await runCountdown();
                
                const pos = config.photos[i];
                drawCroppedVideo(pos.x, pos.y, pos.w, pos.h);
                applyDithering(pos.x, pos.y, pos.w, pos.h);
            }
            
            statusText.innerText = "กำลังประมวลผล...";

            if (config.useCustomPng) {
                let success = await drawPngOverlay(config.pngUrl);
                if(!success) { drawFooterTemplate(currentLayout); } 
            } else {
                drawFooterTemplate(currentLayout);
            }
            
            setTimeout(() => { showScreen('screen-preview'); }, 800);
        }

        function drawPngOverlay(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); resolve(true); };
                img.onerror = () => { console.log("Missing PNG: " + url); resolve(false); };
                img.src = url;
            });
        }

        async function runCountdown() {
            countdownEl.style.display = 'flex';
            for (let i = 3; i > 0; i--) { countdownEl.innerText = i; playBeep('tick'); await new Promise(r => setTimeout(r, 1000)); }
            countdownEl.innerText = ""; playBeep('snap'); 
            countdownEl.style.backgroundColor = "white"; await new Promise(r => setTimeout(r, 150));
            countdownEl.style.backgroundColor = "transparent"; countdownEl.style.display = 'none';
        }

        // ขอตัดฟังก์ชัน BackgroundTemplate กับ FooterTemplate ที่วาดเส้นออก 
        // เพราะตอนนี้เปลี่ยนมาใช้ PNG แบบเต็มๆ 100% หมดแล้ว
        function drawBackgroundTemplate(layout) { }
        function drawFooterTemplate(layout) { }

        function drawCroppedVideo(dx, dy, dWidth, dHeight) {
            const vRatio = video.videoWidth / video.videoHeight; const dRatio = dWidth / dHeight;
            let sWidth, sHeight, sx, sy;
            if (vRatio > dRatio) { sHeight = video.videoHeight; sWidth = sHeight * dRatio; sx = (video.videoWidth - sWidth) / 2; sy = 0; } 
            else { sWidth = video.videoWidth; sHeight = sWidth / dRatio; sx = 0; sy = (video.videoHeight - sHeight) / 2; }
            ctx.save(); ctx.translate(dx + dWidth, dy); ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, dWidth, dHeight); ctx.restore();
        }

        function applyDithering(startX, startY, width, height) {
            const imgData = ctx.getImageData(startX, startY, width, height); const data = imgData.data;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const gray = Math.round(0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2]);
                    const newColor = gray < 128 ? 0 : 255; const err = gray - newColor;
                    data[idx] = data[idx+1] = data[idx+2] = newColor;
                    distributeError(data, width, height, x+1, y, err, 7/16);
                    distributeError(data, width, height, x-1, y+1, err, 3/16);
                    distributeError(data, width, height, x, y+1, err, 5/16);
                    distributeError(data, width, height, x+1, y+1, err, 1/16);
                }
            }
            ctx.putImageData(imgData, startX, startY);
        }
        function distributeError(data, w, h, x, y, err, factor) {
            if (x < 0 || x >= w || y >= h) return; const idx = (y * w + x) * 4; const adjErr = err * factor;
            data[idx] = Math.min(255, Math.max(0, data[idx] + adjErr)); data[idx+1] = Math.min(255, Math.max(0, data[idx+1] + adjErr)); data[idx+2] = Math.min(255, Math.max(0, data[idx+2] + adjErr));
        }

        function changeCopies(amount) {
            printCopyCount += amount;
            if (printCopyCount < 1) printCopyCount = 1;
            if (printCopyCount > 5) printCopyCount = 5; 
            document.getElementById('printCopies').innerText = printCopyCount;
        }

        function printReceipt() {
            if (printCopyCount === 1) {
                let dataUrl = canvas.toDataURL("image/png");
                window.location.href = "rawbt:data:image/png;base64," + dataUrl.split(',')[1];
            } else {
                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                let cutMargin = 120; 
                tempCanvas.height = (canvas.height * printCopyCount) + (cutMargin * (printCopyCount - 1));
                let tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.fillStyle = "white";
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                
                for(let i = 0; i < printCopyCount; i++) {
                    let yPos = i * (canvas.height + cutMargin);
                    tempCtx.drawImage(canvas, 0, yPos);
                    
                    if (i < printCopyCount - 1) {
                        tempCtx.fillStyle = "black";
                        tempCtx.font = "24px sans-serif";
                        tempCtx.textAlign = "center";
                        tempCtx.fillText("✂️ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -", tempCanvas.width/2, yPos + canvas.height + (cutMargin/2) + 8);
                    }
                }
                
                let dataUrl = tempCanvas.toDataURL("image/png");
                window.location.href = "rawbt:data:image/png;base64," + dataUrl.split(',')[1];
            }
        }

        function goToIdle() {
            showScreen('screen-idle');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            printCopyCount = 1; 
            document.getElementById('printCopies').innerText = printCopyCount;
        }

        function resetToHome() { 
            showScreen('screen-home'); 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
        }
    </script>
</body>
</html>
