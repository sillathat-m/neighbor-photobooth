        <div class="preview-container">
            <!-- ขนาดกระดาษ 80mm กว้าง 576px -->
            <canvas id="receiptCanvas" width="576"></canvas>
        </div>
        <div class="action-btns">
            <button class="btn-action btn-retake" onclick="resetToHome()">ถ่ายใหม่</button>
            <button class="btn-action btn-print" onclick="printReceipt()">🖨️ ปริ้นเลย!</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('receiptCanvas');
        const ctx = canvas.getContext('2d');
        const countdownEl = document.getElementById('countdownOverlay');
        const statusText = document.getElementById('statusText');
        
        let currentLayout = '';
        const CANVAS_WIDTH = 576; // ขนาด 80mm

        // เปิดกล้องอัตโนมัติ
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (e) {
                    alert("เปิดกล้องไม่ได้ กรุณาตรวจสอบสิทธิ์: " + e);
                }
            }
        }
        initCamera();

        // เปลี่ยนหน้าจอ
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 1. เลือกเลย์เอาต์แล้วเริ่มถ่าย
        async function selectLayout(layout) {
            currentLayout = layout;
            showScreen('screen-camera');
            
            // รอให้กล้องและหน้าจอพร้อมนิดนึง
            await new Promise(r => setTimeout(r, 1000)); 
            startCaptureSequence();
        }

        // 2. จัดการคิวการถ่ายรูปตามเลย์เอาต์
        async function startCaptureSequence() {
            let photoCount = 1;
            if (currentLayout === 'strip3') photoCount = 3;
            if (currentLayout === 'halloween') photoCount = 2;

            // ตั้งค่าความสูง Canvas ตามเลย์เอาต์
            if (currentLayout === 'ig') canvas.height = 1000;
            if (currentLayout === 'strip3') canvas.height = 2100;
            if (currentLayout === 'polaroid') canvas.height = 850;
            if (currentLayout === 'halloween') canvas.height = 1500;

            // เทพื้นขาว
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // วาด Header / กรอบรอไว้ก่อน
            drawBackgroundTemplate(currentLayout);

            let positions = getPhotoPositions(currentLayout);

            for (let i = 0; i < photoCount; i++) {
                statusText.innerText = `ถ่ายรูปที่ ${i+1} / ${photoCount}`;
                await runCountdown();
                
                // ถ่ายและประมวลผลรูปลง Canvas
                drawCroppedVideo(positions[i].x, positions[i].y, positions[i].w, positions[i].h);
                applyDithering(positions[i].x, positions[i].y, positions[i].w, positions[i].h);
            }
            
            statusText.innerText = "กำลังประมวลผล...";
            
            // วาดส่วนท้าย (Footer) ทับอีกรอบเผื่อมีกราฟิก
            drawFooterTemplate(currentLayout);
            
            setTimeout(() => {
                showScreen('screen-preview');
            }, 500);
        }

        // ฟังก์ชันนับถอยหลัง
        async function runCountdown() {
            countdownEl.style.display = 'flex';
            for (let i = 3; i > 0; i--) {
                countdownEl.innerText = i;
                await new Promise(r => setTimeout(r, 1000));
            }
            countdownEl.innerText = "";
            countdownEl.style.backgroundColor = "white"; // แฟลช
            await new Promise(r => setTimeout(r, 150));
            countdownEl.style.backgroundColor = "transparent";
            countdownEl.style.display = 'none';
        }

        // ฟังก์ชันคืนค่าพิกัดการวางรูป
        function getPhotoPositions(layout) {
            if (layout === 'ig') return [{x: 0, y: 110, w: 576, h: 576}];
            if (layout === 'strip3') return [
                {x: 38, y: 160, w: 500, h: 500},
                {x: 38, y: 700, w: 500, h: 500},
                {x: 38, y: 1240, w: 500, h: 500}
            ];
            if (layout === 'polaroid') return [{x: 38, y: 50, w: 500, h: 500}];
            if (layout === 'halloween') return [
                {x: 38, y: 220, w: 500, h: 500},
                {x: 38, y: 760, w: 500, h: 500}
            ];
            return [];
        }

        // วาดเลย์เอาต์ส่วนพื้นหลังและหัวกระดาษ
        function drawBackgroundTemplate(layout) {
            ctx.fillStyle = "black";
            
            if (layout === 'ig') {
                ctx.beginPath(); ctx.arc(50, 60, 24, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.stroke();
                ctx.textAlign = "left"; ctx.font = "bold 26px sans-serif"; ctx.fillText("neighbor.coffee", 90, 70);
                ctx.font = "bold 36px sans-serif"; ctx.fillText("⋮", 530, 70);
                // เส้นคั่นบน-ล่างรูป
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, 110); ctx.lineTo(576, 110); ctx.moveTo(0, 686); ctx.lineTo(576, 686); ctx.stroke();
            } 
            else if (layout === 'strip3') {
                ctx.textAlign = "center";
                ctx.font = "bold 44px sans-serif"; ctx.fillText("neighbor.coffee", canvas.width / 2, 80);
                ctx.font = "28px sans-serif"; ctx.fillText("x Amber pastry", canvas.width / 2, 120);
                ctx.lineWidth = 6;
                ctx.strokeRect(34, 156, 508, 508);
                ctx.strokeRect(34, 696, 508, 508);
                ctx.strokeRect(34, 1236, 508, 508);
            }
            else if (layout === 'polaroid') {
                ctx.lineWidth = 6;
                ctx.strokeRect(34, 46, 508, 508); // กรอบรูป
                ctx.strokeRect(10, 10, 556, 830); // กรอบนอกสุดโพลาลอยด์
            }
            else if (layout === 'halloween') {
                ctx.textAlign = "center";
                ctx.font = "bold 48px sans-serif"; ctx.fillText("🎃 TRICK OR TREAT 👻", canvas.width / 2, 90);
                ctx.font = "24px sans-serif"; ctx.fillText("Happy Halloween from neighbor.coffee", canvas.width / 2, 130);
                
                // กรอบรูปธีมฮาโลวีน (กรอบหนาซ้อน)
                ctx.lineWidth = 8;
                ctx.strokeRect(34, 216, 508, 508); ctx.strokeRect(26, 208, 524, 524);
                ctx.strokeRect(34, 756, 508, 508); ctx.strokeRect(26, 748, 524, 524);
            }
        }

        // วาดเลย์เอาต์ส่วนท้าย
        function drawFooterTemplate(layout) {
            ctx.fillStyle = "black";
            if (layout === 'ig') {
                ctx.font = "40px sans-serif"; ctx.textAlign = "left"; ctx.fillText("♡  💬  ⌲", 20, 745);
                ctx.textAlign = "right"; ctx.fillText("⚲", 550, 745);
                
                ctx.textAlign = "left";
                ctx.font = "bold 22px sans-serif"; ctx.fillText("9,999 likes", 20, 790);
                ctx.fillText("neighbor.coffee", 20, 825);
                ctx.font = "22px sans-serif"; ctx.fillText(" HAVE A GOOD DAY! 🍰☕", 20 + ctx.measureText("neighbor.coffee ").width, 825);
                
                let today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
                ctx.font = "18px sans-serif"; ctx.fillStyle = "#555"; ctx.fillText(today, 20, 865);
            }
            else if (layout === 'strip3') {
                ctx.textAlign = "center";
                ctx.font = "bold 34px sans-serif"; ctx.fillText("HAVE A GOOD DAY!", canvas.width / 2, 1920);
                ctx.font = "24px sans-serif"; ctx.fillText("( ˘ ³˘)♥", canvas.width / 2, 1970);
            }
            else if (layout === 'polaroid') {
                // เขียนข้อความสไตล์ลายมือด้านล่าง
                ctx.textAlign = "center";
                ctx.font = "bold 36px 'Kanit', sans-serif"; ctx.fillText("neighbor.coffee", canvas.width / 2, 650);
                ctx.font = "24px sans-serif"; ctx.fillText("Memories with you 🤍", canvas.width / 2, 700);
            }
            else if (layout === 'halloween') {
                ctx.textAlign = "center";
                ctx.font = "bold 36px sans-serif"; ctx.fillText("🕷️ 🕸️ 🦇 🕸️ 🕷️", canvas.width / 2, 1370);
                ctx.font = "28px sans-serif"; ctx.fillText("BOO! HAVE A GOOD DAY!", canvas.width / 2, 1420);
            }
        }

        // ครอปวิดีโอตรงกลาง
        function drawCroppedVideo(dx, dy, dWidth, dHeight) {
            const vRatio = video.videoWidth / video.videoHeight;
            const dRatio = dWidth / dHeight;
            let sWidth, sHeight, sx, sy;

            if (vRatio > dRatio) {
                sHeight = video.videoHeight;
                sWidth = sHeight * dRatio;
                sx = (video.videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = video.videoWidth;
                sHeight = sWidth / dRatio;
                sx = 0;
                sy = (video.videoHeight - sHeight) / 2;
            }

            ctx.save();
            ctx.translate(dx + dWidth, dy);
            ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, dWidth, dHeight);
            ctx.restore();
        }

        // Dithering แปลงเป็นจุดขาวดำ
        function applyDithering(startX, startY, width, height) {
            const imgData = ctx.getImageData(startX, startY, width, height);
            const data = imgData.data;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const gray = Math.round(0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2]);
                    const newColor = gray < 128 ? 0 : 255;
                    const err = gray - newColor;
                    data[idx] = data[idx+1] = data[idx+2] = newColor;
                    distributeError(data, width, height, x+1, y, err, 7/16);
                    distributeError(data, width, height, x-1, y+1, err, 3/16);
                    distributeError(data, width, height, x, y+1, err, 5/16);
                    distributeError(data, width, height, x+1, y+1, err, 1/16);
                }
            }
            ctx.putImageData(imgData, startX, startY);
        }
        function distributeError(data, w, h, x, y, err, factor) {
            if (x < 0 || x >= w || y >= h) return;
            const idx = (y * w + x) * 4;
            const adjErr = err * factor;
            data[idx] = Math.min(255, Math.max(0, data[idx] + adjErr));
            data[idx+1] = Math.min(255, Math.max(0, data[idx+1] + adjErr));
            data[idx+2] = Math.min(255, Math.max(0, data[idx+2] + adjErr));
        }

        // สั่งปริ้น
        function printReceipt() {
            let dataUrl = canvas.toDataURL("image/png");
            let base64Data = dataUrl.split(',')[1];
            window.location.href = "rawbt:data:image/png;base64," + base64Data;
            
            // รอ 2 วิ แล้วเด้งกลับหน้าแรก
            setTimeout(resetToHome, 2000);
        }

        // กลับหน้าหลัก
        function resetToHome() {
            showScreen('screen-home');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
