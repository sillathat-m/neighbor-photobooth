<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neighbor Photobooth Kiosk</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Kanit', sans-serif;
            background-color: #FAF8F5; /* สีพื้นหลังเหมือนหน้า Idle */
            color: #111; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
            background-color: #FAF8F5;
        }
        .screen.active { display: flex; }

        /* --- หน้าจอ Idle (รอคนมากด) --- */
        #screen-idle { cursor: pointer; }
        .idle-title { font-family: 'Playfair Display', serif; font-size: 56px; color: #111; margin-bottom: 20px; line-height: 1.1; }
        .idle-title span { font-family: 'Playfair Display', serif; font-style: italic; font-weight: normal; font-size: 40px; }
        .idle-animation-box {
            width: 120px; height: 200px; overflow: hidden; margin: 30px auto; border: 2px solid #ccc;
            background: white; padding: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .film-strip {
            display: flex; flex-direction: column; gap: 5px;
            animation: scrollFilm 4s linear infinite;
        }
        .film-strip div { width: 100%; height: 80px; background-color: #ddd; border-radius: 4px; }
        @keyframes scrollFilm { 0% { transform: translateY(0); } 100% { transform: translateY(-170px); } }
        .pulse-text { font-family: 'Kanit', sans-serif; font-size: 20px; font-weight: 400; color: #555; animation: pulse 1.5s infinite; margin-top: 40px; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        /* --- หน้าเลือก Layout --- */
        #screen-home h1 { font-family: 'Playfair Display', serif; font-size: 42px; color: #111; margin-bottom: 5px; }
        #screen-home p { font-size: 18px; color: #555; margin-bottom: 40px; font-weight: 300; }
        
        .layout-grid { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; width: 100%; max-width: 800px; 
        }
        
        .frame-card {
            background: #fff; border: 2px solid #eaeaea; border-radius: 20px;
            width: 180px; padding: 25px 15px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
            animation: float 4s ease-in-out infinite;
        }
        /* แอนิเมชันให้การ์ดลอยขึ้นลงต่างจังหวะกัน */
        .frame-card:nth-child(1) { animation-delay: 0s; }
        .frame-card:nth-child(2) { animation-delay: 0.5s; }
        .frame-card:nth-child(3) { animation-delay: 1s; }
        .frame-card:nth-child(4) { animation-delay: 1.5s; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        
        .frame-card:active { transform: scale(0.95); border-color: #111; }
        
        /* CSS วาดตัวอย่างกรอบ */
        .mini-preview {
            width: 80px; height: 110px; background: #fff; border: 2px solid #ddd;
            margin-bottom: 20px; position: relative; display: flex; flex-direction: column; align-items: center;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.05);
        }
        .mini-preview .box { background: #f4f4f4; border: 1px solid #e0e0e0; }
        
        /* 1. IG */
        .mini-ig { padding-top: 25px; }
        .mini-ig::before { content: ''; position: absolute; top: 5px; left: 5px; width: 12px; height: 12px; border-radius: 50%; background: #ccc; }
        .mini-ig .box { width: 70px; height: 60px; margin-top: 5px; }
        
        /* 2. Strip 3 */
        .mini-strip { height: 140px; justify-content: space-evenly; padding: 5px 0; }
        .mini-strip .box { width: 60px; height: 38px; }
        
        /* 3. Polaroid */
        .mini-polaroid { padding: 6px; padding-bottom: 28px; }
        .mini-polaroid .box { width: 100%; height: 100%; }
        
        /* 4. Halloween */
        .mini-hw { border-color: #FF9800; background: #FFF9F0; justify-content: space-evenly; padding: 5px 0;}
        .mini-hw::after { content: '🎃'; position: absolute; bottom: 2px; right: 4px; font-size: 16px; }
        .mini-hw::before { content: '🦇'; position: absolute; top: 2px; left: 4px; font-size: 14px; }
        .mini-hw .box { width: 60px; height: 45px; border-color: #FFCC80; }

        .frame-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: bold; color: #111; }
        .frame-desc { font-family: 'Kanit', sans-serif; font-size: 14px; color: #777; margin-top: 5px; font-weight: 300;}

        /* --- หน้ากล้องถ่ายรูป --- */
        .camera-wrapper {
            position: relative; width: 90%; max-width: 600px; aspect-ratio: 1/1;
            border-radius: 20px; overflow: hidden; border: 6px solid #111;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        #cameraOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5; background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: space-between; padding: 10px;
        }
        
        #countdownOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center;
            font-size: 180px; font-family: 'Playfair Display', serif; font-weight: bold; color: white;
            text-shadow: 0px 5px 20px rgba(0,0,0,0.8); z-index: 10;
        }

        #statusText { font-size: 24px; font-weight: 400; color: #111; margin: 20px 0; height: 35px; }

        .btn-main {
            background-color: #111; color: white; border: none; padding: 20px 60px;
            font-size: 22px; font-weight: 600; font-family: 'Kanit', sans-serif;
            border-radius: 40px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn-main:active { transform: scale(0.95); }

        /* --- หน้าพรีวิว --- */
        .preview-container {
            width: 100%; max-width: 400px; height: 60vh; overflow-y: auto;
            border: 2px solid #ccc; background: white; border-radius: 10px;
            margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        #receiptCanvas { width: 100%; display: block; }
        .action-btns { display: flex; gap: 15px; width: 100%; max-width: 400px; }
        .btn-action {
            flex: 1; padding: 20px; font-size: 20px; font-family: 'Kanit', sans-serif;
            border: none; border-radius: 15px; cursor: pointer; font-weight: 600; color: white;
        }
        .btn-retake { background-color: #999; color: #fff; }
        .btn-print { background-color: #111; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-action:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <!-- Screen 0: Idle (Touch to start) -->
    <div id="screen-idle" class="screen active" onclick="startApp()">
        <div class="idle-title">
            <span>neighbor's</span><br>PHOTOBOOTH
        </div>
        <div class="idle-animation-box">
            <div class="film-strip">
                <div style="background:#555;"></div>
                <div style="background:#888;"></div>
                <div style="background:#bbb;"></div>
                <div style="background:#555;"></div>
            </div>
        </div>
        <div class="pulse-text">แตะหน้าจอเพื่อเริ่มต้น<br>(Tap to Start)</div>
    </div>

    <!-- Screen 1: Home / Select Layout -->
    <div id="screen-home" class="screen">
        <h1>Choose Frame</h1>
        <p>เลือกกรอบรูปที่คุณต้องการ</p>
        
        <div class="layout-grid">
            <div class="frame-card" onclick="selectLayout('ig')">
                <div class="mini-preview mini-ig">
                    <div class="box"></div>
                </div>
                <div class="frame-name">Instagram</div>
                <div class="frame-desc">1 รูปภาพ</div>
            </div>

            <div class="frame-card" onclick="selectLayout('strip3')">
                <div class="mini-preview mini-strip">
                    <div class="box"></div><div class="box"></div><div class="box"></div>
                </div>
                <div class="frame-name">Photobooth</div>
                <div class="frame-desc">3 รูปภาพ</div>
            </div>

            <div class="frame-card" onclick="selectLayout('polaroid')">
                <div class="mini-preview mini-polaroid">
                    <div class="box"></div>
                </div>
                <div class="frame-name">Polaroid</div>
                <div class="frame-desc">1 รูปภาพ</div>
            </div>

            <div class="frame-card" onclick="selectLayout('halloween')">
                <div class="mini-preview mini-hw">
                    <div class="box"></div><div class="box"></div>
                </div>
                <div class="frame-name">Halloween</div>
                <div class="frame-desc">2 รูปภาพ</div>
            </div>
        </div>
    </div>

    <!-- Screen 2: Camera -->
    <div id="screen-camera" class="screen">
        <div class="camera-wrapper">
            <video id="camera" autoplay playsinline></video>
            <div id="cameraOverlay"></div>
            <div id="countdownOverlay"></div>
        </div>
        <div id="statusText">เตรียมตัวให้พร้อม...</div>
        <button id="startCaptureBtn" class="btn-main" onclick="startCaptureSequence()">📸 กดเพื่อถ่ายรูป</button>
    </div>

    <!-- Screen 3: Preview -->
    <div id="screen-preview" class="screen">
        <div class="preview-container">
            <canvas id="receiptCanvas" width="384"></canvas>
        </div>
        <div class="action-btns">
            <button class="btn-action btn-retake" onclick="resetToHome()">ถ่ายใหม่</button>
            <button class="btn-action btn-print" onclick="printReceipt()">🖨️ ปริ้นรูปภาพ</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('receiptCanvas');
        const ctx = canvas.getContext('2d');
        const countdownEl = document.getElementById('countdownOverlay');
        const statusText = document.getElementById('statusText');
        const cameraOverlay = document.getElementById('cameraOverlay');
        const startCaptureBtn = document.getElementById('startCaptureBtn');
        let currentLayout = '';
        
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        function playBeep(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'snap') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (e) {
                    console.log("กล้องเปิดไม่ได้");
                }
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startApp() {
            initAudio();
            initCamera();
            showScreen('screen-home');
        }

        async function selectLayout(layout) {
            initAudio();
            currentLayout = layout;
            setupCameraOverlay(layout);
            
            showScreen('screen-camera');
            startCaptureBtn.style.display = 'block';
            statusText.innerText = "จัดท่าให้พร้อม ยิ้มเยอะๆ แล้วกดเริ่ม!";
        }

        function setupCameraOverlay(layout) {
            cameraOverlay.innerHTML = ''; 
            cameraOverlay.style.border = "none";
            
            if (layout === 'ig') {
                cameraOverlay.style.border = "2px solid rgba(255,255,255,0.6)";
            } else if (layout === 'polaroid') {
                cameraOverlay.style.border = "24px solid white";
                cameraOverlay.style.borderBottom = "60px solid white";
            } else if (layout === 'halloween') {
                cameraOverlay.style.border = "8px solid #FF9800";
                cameraOverlay.innerHTML = `
                    <div style="font-size:45px; position:absolute; top:5px; left:5px;">🕸️</div>
                    <div style="font-size:45px; position:absolute; top:5px; right:5px;">🕷️</div>
                    <div style="font-size:45px; position:absolute; bottom:5px; left:5px;">🎃</div>
                    <div style="font-size:45px; position:absolute; bottom:5px; right:5px;">🦇</div>
                `;
            } else {
                cameraOverlay.style.border = "4px solid rgba(255,255,255,0.8)";
            }
        }

        async function startCaptureSequence() {
            initAudio();
            startCaptureBtn.style.display = 'none'; 
            
            let photoCount = 1;
            if (currentLayout === 'strip3') photoCount = 3;
            if (currentLayout === 'halloween') photoCount = 2;

            if (currentLayout === 'ig') canvas.height = 600;
            if (currentLayout === 'strip3') canvas.height = 1350;
            if (currentLayout === 'polaroid') canvas.height = 520;
            if (currentLayout === 'halloween') canvas.height = 960;

            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawBackgroundTemplate(currentLayout);
            let positions = getPhotoPositions(currentLayout);

            for (let i = 0; i < photoCount; i++) {
                statusText.innerText = `ถ่ายรูปที่ ${i+1} / ${photoCount}`;
                await runCountdown();
                drawCroppedVideo(positions[i].x, positions[i].y, positions[i].w, positions[i].h);
                applyDithering(positions[i].x, positions[i].y, positions[i].w, positions[i].h);
            }
            
            statusText.innerText = "กำลังประมวลผล...";
            drawFooterTemplate(currentLayout);
            
            setTimeout(() => { showScreen('screen-preview'); }, 800);
        }

        async function runCountdown() {
            countdownEl.style.display = 'flex';
            for (let i = 3; i > 0; i--) {
                countdownEl.innerText = i;
                playBeep('tick'); 
                await new Promise(r => setTimeout(r, 1000));
            }
            countdownEl.innerText = "";
            playBeep('snap'); 
            countdownEl.style.backgroundColor = "white"; 
            await new Promise(r => setTimeout(r, 150));
            countdownEl.style.backgroundColor = "transparent";
            countdownEl.style.display = 'none';
        }

        function getPhotoPositions(layout) {
            if (layout === 'ig') return [{x: 0, y: 70, w: 384, h: 384}];
            if (layout === 'strip3') return [
                {x: 20, y: 120, w: 344, h: 344},
                {x: 20, y: 484, w: 344, h: 344},
                {x: 20, y: 848, w: 344, h: 344}
            ];
            if (layout === 'polaroid') return [{x: 24, y: 24, w: 336, h: 336}];
            if (layout === 'halloween') return [
                {x: 24, y: 120, w: 336, h: 336},
                {x: 24, y: 480, w: 336, h: 336}
            ];
            return [];
        }

        function drawBackgroundTemplate(layout) {
            ctx.fillStyle = "black";
            if (layout === 'ig') {
                ctx.beginPath(); ctx.arc(35, 40, 16, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.stroke();
                ctx.textAlign = "left"; ctx.font = "bold 18px sans-serif"; ctx.fillText("neighbor.coffee", 62, 46);
                ctx.font = "bold 24px sans-serif"; ctx.fillText("⋮", 355, 48);
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, 70); ctx.lineTo(384, 70); ctx.moveTo(0, 454); ctx.lineTo(384, 454); ctx.stroke();
            } 
            else if (layout === 'strip3') {
                ctx.textAlign = "center";
                ctx.font = "bold 32px 'Kanit', serif"; ctx.fillText("Neighbor.coffee", 192, 60);
                ctx.lineWidth = 4;
                ctx.strokeRect(18, 118, 348, 348);
                ctx.strokeRect(18, 482, 348, 348);
                ctx.strokeRect(18, 846, 348, 348);
            }
            else if (layout === 'polaroid') {
                ctx.lineWidth = 4;
                ctx.strokeRect(22, 22, 340, 340);
                ctx.strokeRect(10, 10, 364, 500);
            }
            else if (layout === 'halloween') {
                ctx.textAlign = "center";
                ctx.font = "bold 28px 'Kanit', sans-serif"; ctx.fillText("🎃 TRICK OR TREAT 👻", 192, 60);
                ctx.font = "16px 'Kanit', sans-serif"; ctx.fillText("Happy Halloween from Neighbor.coffee", 192, 90);
                ctx.lineWidth = 6;
                ctx.strokeRect(24, 120, 336, 336); ctx.strokeRect(18, 114, 348, 348);
                ctx.strokeRect(24, 480, 336, 336); ctx.strokeRect(18, 474, 348, 348);
            }
        }

        function drawFooterTemplate(layout) {
            ctx.fillStyle = "black";
            if (layout === 'ig') {
                ctx.font = "28px sans-serif"; ctx.textAlign = "left"; ctx.fillText("♡  💬  ⌲", 15, 495);
                ctx.textAlign = "right"; ctx.fillText("⚲", 370, 495);
                ctx.textAlign = "left"; ctx.font = "bold 15px sans-serif"; ctx.fillText("9,999 likes", 15, 525);
                ctx.fillText("neighbor.coffee : ", 15, 548);
                ctx.font = "15px 'Kanit', sans-serif"; ctx.fillText(" HAVE A GOOD DAY! 🍰☕", 15 + ctx.measureText("neighbor.coffee ").width, 548);
                let today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }).toUpperCase();
                ctx.font = "12px sans-serif"; ctx.fillStyle = "#555"; ctx.fillText(today, 15, 575);
                ctx.lineWidth = 20;
            }
            else if (layout === 'strip3') {
                ctx.textAlign = "center";
                ctx.font = "bold 24px 'Kanit', sans-serif"; ctx.fillText("HAVE A GOOD DAY!", 192, 1260);
                ctx.font = "18px sans-serif"; ctx.fillText("( ˘ ³˘)♥", 192, 1300);
            }
            else if (layout === 'polaroid') {
                ctx.textAlign = "center";
                ctx.font = "bold 28px 'Kanit', serif"; ctx.fillText("Neighbor.coffee", 192, 420);
                ctx.font = "16px 'Kanit', serif"; ctx.fillText("Memories with you 🤍", 192, 460);
            }
            else if (layout === 'halloween') {
                ctx.textAlign = "center";
                ctx.font = "bold 28px sans-serif"; ctx.fillText("🕷️ 🕸️ 🦇 🕸️ 🕷️", 192, 880);
                ctx.font = "20px 'Kanit', sans-serif"; ctx.fillText("BOO! HAVE A HALLOWEEN DAY!", 192, 920);
                
                ctx.font = "40px sans-serif";
                ctx.fillText("🕸️", 40, 155); ctx.fillText("🕷️", 345, 155);
                ctx.fillText("🎃", 40, 445); ctx.fillText("🦇", 345, 445);
                ctx.fillText("🕸️", 40, 515); ctx.fillText("🕷️", 345, 515);
                ctx.fillText("🎃", 40, 805); ctx.fillText("🦇", 345, 805);
            }
        }

        function drawCroppedVideo(dx, dy, dWidth, dHeight) {
            const vRatio = video.videoWidth / video.videoHeight;
            const dRatio = dWidth / dHeight;
            let sWidth, sHeight, sx, sy;
            if (vRatio > dRatio) {
                sHeight = video.videoHeight;
                sWidth = sHeight * dRatio;
                sx = (video.videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = video.videoWidth;
                sHeight = sWidth / dRatio;
                sx = 0;
                sy = (video.videoHeight - sHeight) / 2;
            }
            ctx.save();
            ctx.translate(dx + dWidth, dy);
            ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, dWidth, dHeight);
            ctx.restore();
        }

        function applyDithering(startX, startY, width, height) {
            const imgData = ctx.getImageData(startX, startY, width, height);
            const data = imgData.data;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const gray = Math.round(0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2]);
                    const newColor = gray < 128 ? 0 : 255;
                    const err = gray - newColor;
                    data[idx] = data[idx+1] = data[idx+2] = newColor;
                    distributeError(data, width, height, x+1, y, err, 7/16);
                    distributeError(data, width, height, x-1, y+1, err, 3/16);
                    distributeError(data, width, height, x, y+1, err, 5/16);
                    distributeError(data, width, height, x+1, y+1, err, 1/16);
                }
            }
            ctx.putImageData(imgData, startX, startY);
        }
        function distributeError(data, w, h, x, y, err, factor) {
            if (x < 0 || x >= w || y >= h) return;
            const idx = (y * w + x) * 4;
            const adjErr = err * factor;
            data[idx] = Math.min(255, Math.max(0, data[idx] + adjErr));
            data[idx+1] = Math.min(255, Math.max(0, data[idx+1] + adjErr));
            data[idx+2] = Math.min(255, Math.max(0, data[idx+2] + adjErr));
        }

        function printReceipt() {
            let dataUrl = canvas.toDataURL("image/png");
            let base64Data = dataUrl.split(',')[1];
            window.location.href = "rawbt:data:image/png;base64," + base64Data;
            setTimeout(() => { showScreen('screen-idle'); }, 2000); 
        }

        function resetToHome() {
            showScreen('screen-home');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
