<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighbor Photobooth (IG Style)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            text-align: center;
            background-color: #FDF4F5;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #8B5A2B; margin-bottom: 10px; }
        .camera-container {
            margin: 0 auto 20px auto;
            width: 320px;
            height: 320px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #8B5A2B;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .btn {
            background-color: #8B5A2B;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Kanit', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(139, 90, 43, 0.3);
            transition: 0.2s;
            margin: 5px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-print { background-color: #4CAF50; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3); }
        
        #receiptCanvas {
            display: none; 
            margin: 20px auto;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h2>📸 photobooth.</h2>
    <p style="color:#666; margin-top:-10px;">สไตล์ Instagram โพสต์</p>

    <div class="camera-container">
        <!-- แก้ไข: เพิ่มวิดีโอแบบเต็มจอ -->
        <video id="camera" autoplay playsinline></video>
    </div>

    <button id="snapBtn" class="btn">📸 กดถ่ายรูป</button>
    <button id="printBtn" class="btn btn-print" style="display: none;">🖨️ พิมพ์ใบเสร็จ</button>

    <!-- ปรับความสูง Canvas เป็น 600px ให้พอดีกับเลย์เอาต์ IG -->
    <canvas id="receiptCanvas" width="384" height="600"></canvas>

    <script>
        const video = document.getElementById('camera');
        const snapBtn = document.getElementById('snapBtn');
        const printBtn = document.getElementById('printBtn');
        const canvas = document.getElementById('receiptCanvas');
        const ctx = canvas.getContext('2d');

        // ดึงกล้อง (ปรับเป็น video: true เพื่อให้เทสบนคอมได้ด้วย)
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("ไม่สามารถเปิดกล้องได้: " + err); });

        snapBtn.addEventListener('click', () => {
            // พื้นหลังสีขาว
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ==========================================
            // 1. ส่วนหัว (Header) สไตล์ IG
            // ==========================================
            ctx.fillStyle = "black";
            
            // วาดรูปโปรไฟล์ (วงกลม)
            ctx.beginPath();
            ctx.arc(35, 40, 16, 0, Math.PI * 2);
            ctx.lineWidth = 2;
            ctx.stroke();

            // ชื่อร้าน (Username)
            ctx.textAlign = "left";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText("neighbor.coffee", 62, 46);

            // จุด 3 จุด (Menu)
            ctx.font = "bold 24px sans-serif";
            ctx.fillText("⋮", 355, 48);

            // ==========================================
            // 2. ส่วนรูปถ่าย (Photo Area) 
            // ==========================================
            // ถ่ายรูปเต็มความกว้าง (384x384px)
            ctx.save();
            ctx.scale(-1, 1);
            // พิกัดรูป: ขยับแกน Y ลงมาที่ 70
            ctx.drawImage(video, -384, 70, 384, 384);
            ctx.restore();

            // แปลงภาพเป็นจุดไข่ปลา (Dithering) เฉพาะโซนรูปภาพ
            applyDithering(canvas, ctx, 0, 70, 384, 384);

            // วาดเส้นขอบบางๆ คั่นรูป (บน-ล่าง)
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 70); ctx.lineTo(384, 70);
            ctx.moveTo(0, 454); ctx.lineTo(384, 454);
            ctx.stroke();

            // ==========================================
            // 3. ส่วนไอคอน (Action Bar)
            // ==========================================
            ctx.fillStyle = "black";
            ctx.font = "28px sans-serif";
            // ไอคอน: หัวใจ, คอมเมนต์, แชร์ (ใช้ Unicode ลายเส้นเพื่อความคมชัด)
            ctx.fillText("♡  💬  ⌲", 15, 495);
            
            // ไอคอน Save ฝั่งขวา
            ctx.textAlign = "right";
            ctx.fillText("⚲", 370, 495);

            // ==========================================
            // 4. แคปชั่นและวันที่ (Caption & Date)
            // ==========================================
            ctx.textAlign = "left";
            
            // ยอด Like
            ctx.font = "bold 15px sans-serif";
            ctx.fillText("9,999 likes", 15, 525);
            
            // Username ในแคปชั่น
            ctx.fillText("neighbor.coffee", 15, 548);
            
            // เนื้อหาแคปชั่น
            ctx.font = "15px sans-serif";
            let usernameWidth = ctx.measureText("neighbor.coffee ").width;
            ctx.fillText(" HAVE A GOOD DAY! 🍰☕", 15 + usernameWidth, 548);

            // วันที่
            let today = new Date();
            let dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
            let dateStr = today.toLocaleDateString('en-US', dateOptions).toUpperCase();
            
            ctx.font = "12px sans-serif";
            ctx.fillStyle = "#333";
            ctx.fillText(dateStr, 15, 575);

            // โชว์ปุ่มสั่งปริ้น
            canvas.style.display = "block";
            printBtn.style.display = "inline-block";
        });

        printBtn.addEventListener('click', () => {
            let dataUrl = canvas.toDataURL("image/png");
            let base64Data = dataUrl.split(',')[1];
            window.location.href = "rawbt:data:image/png;base64," + base64Data;
        });

        // ฟังก์ชัน Dithering แปลงภาพขาวดำ (เหมือนเดิม)
        function applyDithering(cvs, context, startX, startY, width, height) {
            const imgData = context.getImageData(startX, startY, width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const oldR = data[idx];
                    const oldG = data[idx + 1];
                    const oldB = data[idx + 2];
                    
                    const gray = Math.round(0.299 * oldR + 0.587 * oldG + 0.114 * oldB);
                    const newColor = gray < 128 ? 0 : 255;
                    const err = gray - newColor;

                    data[idx] = data[idx + 1] = data[idx + 2] = newColor;

                    distributeError(data, width, height, x + 1, y, err, 7 / 16);
                    distributeError(data, width, height, x - 1, y + 1, err, 3 / 16);
                    distributeError(data, width, height, x, y + 1, err, 5 / 16);
                    distributeError(data, width, height, x + 1, y + 1, err, 1 / 16);
                }
            }
            context.putImageData(imgData, startX, startY);
        }

        function distributeError(data, width, height, x, y, err, factor) {
            if (x < 0 || x >= width || y >= height) return;
            const idx = (y * width + x) * 4;
            const adjustedErr = err * factor;
            data[idx] = Math.min(255, Math.max(0, data[idx] + adjustedErr));
            data[idx + 1] = Math.min(255, Math.max(0, data[idx + 1] + adjustedErr));
            data[idx + 2] = Math.min(255, Math.max(0, data[idx + 2] + adjustedErr));
        }
    </script>
</body>
</html>
