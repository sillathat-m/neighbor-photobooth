<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neighbor Photobooth Kiosk (58mm)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');
        
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Kanit', sans-serif;
            background-color: #FDF4F5;
            color: #333; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }
        .screen.active { display: flex; }

        #screen-home h1 { font-size: 42px; color: #8B5A2B; margin-bottom: 5px; }
        #screen-home p { font-size: 20px; color: #666; margin-bottom: 40px; }
        
        .layout-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 600px;
        }
        .btn-layout {
            background-color: white; border: 3px solid #8B5A2B; border-radius: 20px;
            padding: 30px 20px; font-size: 24px; font-weight: 600; color: #8B5A2B;
            font-family: 'Kanit', sans-serif; cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 15px rgba(139, 90, 43, 0.15);
        }
        .btn-layout:active { transform: scale(0.95); background-color: #8B5A2B; color: white; }
        .btn-layout span { display: block; font-size: 16px; font-weight: 400; margin-top: 10px; color: #777; }
        .btn-layout:active span { color: #f0f0f0; }

        .camera-wrapper {
            position: relative; width: 90%; max-width: 600px; aspect-ratio: 1/1;
            border-radius: 20px; overflow: hidden; border: 6px solid #8B5A2B;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); background-color: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        #countdownOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center;
            font-size: 180px; font-weight: bold; color: white;
            text-shadow: 0px 5px 20px rgba(0,0,0,0.8); z-index: 10;
        }

        #statusText { font-size: 24px; font-weight: 600; color: #8B5A2B; margin-top: 30px; height: 35px; }

        .preview-container {
            width: 100%; max-width: 400px; height: 60vh; overflow-y: auto;
            border: 2px solid #ccc; background: white; border-radius: 10px;
            margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #receiptCanvas { width: 100%; display: block; }
        
        .action-btns { display: flex; gap: 15px; width: 100%; max-width: 400px; }
        .btn-action {
            flex: 1; padding: 20px; font-size: 22px; font-family: 'Kanit', sans-serif;
            border: none; border-radius: 15px; cursor: pointer; font-weight: 600; color: white;
        }
        .btn-retake { background-color: #aaa; }
        .btn-print { background-color: #4CAF50; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4); }
        .btn-action:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="screen-home" class="screen active">
        <h1>📸 photobooth.</h1>
        <p>neighbor.coffee x Amber pastry</p>
        <div class="layout-grid">
            <button class="btn-layout" onclick="selectLayout('ig')">Instagram <span>(1 รูป)</span></button>
            <button class="btn-layout" onclick="selectLayout('strip3')">Photobooth <span>(3 รูป)</span></button>
            <button class="btn-layout" onclick="selectLayout('polaroid')">Polaroid <span>(1 รูป)</span></button>
            <button class="btn-layout" onclick="selectLayout('halloween')">Halloween <span>(2 รูป)</span></button>
        </div>
    </div>

    <div id="screen-camera" class="screen">
        <div class="camera-wrapper">
            <video id="camera" autoplay playsinline></video>
            <div id="countdownOverlay"></div>
        </div>
        <div id="statusText">เตรียมตัวให้พร้อม...</div>
    </div>

    <div id="screen-preview" class="screen">
        <div class="preview-container">
            <canvas id="receiptCanvas" width="384"></canvas>
        </div>
        <div class="action-btns">
            <button class="btn-action btn-retake" onclick="resetToHome()">ถ่ายใหม่</button>
            <button class="btn-action btn-print" onclick="printReceipt()">🖨️ ปริ้นเลย!</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('receiptCanvas');
        const ctx = canvas.getContext('2d');
        const countdownEl = document.getElementById('countdownOverlay');
        const statusText = document.getElementById('statusText');
        let currentLayout = '';

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (e) {
                    alert("เปิดกล้องไม่ได้: " + e);
                }
            }
        }
        initCamera();

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function selectLayout(layout) {
            currentLayout = layout;
            showScreen('screen-camera');
            await new Promise(r => setTimeout(r, 1000)); 
            startCaptureSequence();
        }

        async function startCaptureSequence() {
            let photoCount = 1;
            if (currentLayout === 'strip3') photoCount = 3;
            if (currentLayout === 'halloween') photoCount = 2;

            if (currentLayout === 'ig') canvas.height = 600;
            if (currentLayout === 'strip3') canvas.height = 1350;
            if (currentLayout === 'polaroid') canvas.height = 520;
            if (currentLayout === 'halloween') canvas.height = 960;

            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawBackgroundTemplate(currentLayout);
            let positions = getPhotoPositions(currentLayout);

            for (let i = 0; i < photoCount; i++) {
                statusText.innerText = `ถ่ายรูปที่ ${i+1} / ${photoCount}`;
                await runCountdown();
                drawCroppedVideo(positions[i].x, positions[i].y, positions[i].w, positions[i].h);
                applyDithering(positions[i].x, positions[i].y, positions[i].w, positions[i].h);
            }
            
            statusText.innerText = "กำลังประมวลผล...";
            drawFooterTemplate(currentLayout);
            setTimeout(() => { showScreen('screen-preview'); }, 500);
        }

        async function runCountdown() {
            countdownEl.style.display = 'flex';
            for (let i = 3; i > 0; i--) {
                countdownEl.innerText = i;
                await new Promise(r => setTimeout(r, 1000));
            }
            countdownEl.innerText = "";
            countdownEl.style.backgroundColor = "white";
            await new Promise(r => setTimeout(r, 150));
            countdownEl.style.backgroundColor = "transparent";
            countdownEl.style.display = 'none';
        }

        function getPhotoPositions(layout) {
            if (layout === 'ig') return [{x: 0, y: 70, w: 384, h: 384}];
            if (layout === 'strip3') return [
                {x: 20, y: 120, w: 344, h: 344},
                {x: 20, y: 484, w: 344, h: 344},
                {x: 20, y: 848, w: 344, h: 344}
            ];
            if (layout === 'polaroid') return [{x: 24, y: 24, w: 336, h: 336}];
            if (layout === 'halloween') return [
                {x: 24, y: 120, w: 336, h: 336},
                {x: 24, y: 480, w: 336, h: 336}
            ];
            return [];
        }

        function drawBackgroundTemplate(layout) {
            ctx.fillStyle = "black";
            if (layout === 'ig') {
                ctx.beginPath(); ctx.arc(35, 40, 16, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.stroke();
                ctx.textAlign = "left"; ctx.font = "bold 18px sans-serif"; ctx.fillText("neighbor.coffee", 62, 46);
                ctx.font = "bold 24px sans-serif"; ctx.fillText("⋮", 355, 48);
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, 70); ctx.lineTo(384, 70); ctx.moveTo(0, 454); ctx.lineTo(384, 454); ctx.stroke();
            } 
            else if (layout === 'strip3') {
                ctx.textAlign = "center";
                ctx.font = "bold 32px sans-serif"; ctx.fillText("neighbor.coffee", 192, 60);
                ctx.font = "20px sans-serif"; ctx.fillText("x Amber pastry", 192, 90);
                ctx.lineWidth = 4;
                ctx.strokeRect(18, 118, 348, 348);
                ctx.strokeRect(18, 482, 348, 348);
                ctx.strokeRect(18, 846, 348, 348);
            }
            else if (layout === 'polaroid') {
                ctx.lineWidth = 4;
                ctx.strokeRect(22, 22, 340, 340);
                ctx.strokeRect(10, 10, 364, 500);
            }
            else if (layout === 'halloween') {
                ctx.textAlign = "center";
                ctx.font = "bold 28px sans-serif"; ctx.fillText("🎃 TRICK OR TREAT 👻", 192, 60);
                ctx.font = "16px sans-serif"; ctx.fillText("Happy Halloween from neighbor.coffee", 192, 90);
                ctx.lineWidth = 6;
                ctx.strokeRect(24, 120, 336, 336); ctx.strokeRect(18, 114, 348, 348);
                ctx.strokeRect(24, 480, 336, 336); ctx.strokeRect(18, 474, 348, 348);
            }
        }

        function drawFooterTemplate(layout) {
            ctx.fillStyle = "black";
            if (layout === 'ig') {
                ctx.font = "28px sans-serif"; ctx.textAlign = "left"; ctx.fillText("♡  💬  ⌲", 15, 495);
                ctx.textAlign = "right"; ctx.fillText("⚲", 370, 495);
                ctx.textAlign = "left"; ctx.font = "bold 15px sans-serif"; ctx.fillText("9,999 likes", 15, 525);
                ctx.fillText("neighbor.coffee", 15, 548);
                ctx.font = "15px sans-serif"; ctx.fillText(" HAVE A GOOD DAY! 🍰☕", 15 + ctx.measureText("neighbor.coffee ").width, 548);
                let today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }).toUpperCase();
                ctx.font = "12px sans-serif"; ctx.fillStyle = "#555"; ctx.fillText(today, 15, 575);
            }
            else if (layout === 'strip3') {
                ctx.textAlign = "center";
                ctx.font = "bold 24px sans-serif"; ctx.fillText("HAVE A GOOD DAY!", 192, 1260);
                ctx.font = "18px sans-serif"; ctx.fillText("( ˘ ³˘)♥", 192, 1300);
            }
            else if (layout === 'polaroid') {
                ctx.textAlign = "center";
                ctx.font = "bold 28px 'Kanit', sans-serif"; ctx.fillText("neighbor.coffee", 192, 420);
                ctx.font = "16px sans-serif"; ctx.fillText("Memories with you 🤍", 192, 460);
            }
            else if (layout === 'halloween') {
                ctx.textAlign = "center";
                ctx.font = "bold 28px sans-serif"; ctx.fillText("🕷️ 🕸️ 🦇 🕸️ 🕷️", 192, 880);
                ctx.font = "20px sans-serif"; ctx.fillText("BOO! HAVE A GOOD DAY!", 192, 920);
            }
        }

        function drawCroppedVideo(dx, dy, dWidth, dHeight) {
            const vRatio = video.videoWidth / video.videoHeight;
            const dRatio = dWidth / dHeight;
            let sWidth, sHeight, sx, sy;
            if (vRatio > dRatio) {
                sHeight = video.videoHeight;
                sWidth = sHeight * dRatio;
                sx = (video.videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = video.videoWidth;
                sHeight = sWidth / dRatio;
                sx = 0;
                sy = (video.videoHeight - sHeight) / 2;
            }
            ctx.save();
            ctx.translate(dx + dWidth, dy);
            ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, dWidth, dHeight);
            ctx.restore();
        }

        function applyDithering(startX, startY, width, height) {
            const imgData = ctx.getImageData(startX, startY, width, height);
            const data = imgData.data;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const gray = Math.round(0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2]);
                    const newColor = gray < 128 ? 0 : 255;
                    const err = gray - newColor;
                    data[idx] = data[idx+1] = data[idx+2] = newColor;
                    distributeError(data, width, height, x+1, y, err, 7/16);
                    distributeError(data, width, height, x-1, y+1, err, 3/16);
                    distributeError(data, width, height, x, y+1, err, 5/16);
                    distributeError(data, width, height, x+1, y+1, err, 1/16);
                }
            }
            ctx.putImageData(imgData, startX, startY);
        }
        function distributeError(data, w, h, x, y, err, factor) {
            if (x < 0 || x >= w || y >= h) return;
            const idx = (y * w + x) * 4;
            const adjErr = err * factor;
            data[idx] = Math.min(255, Math.max(0, data[idx] + adjErr));
            data[idx+1] = Math.min(255, Math.max(0, data[idx+1] + adjErr));
            data[idx+2] = Math.min(255, Math.max(0, data[idx+2] + adjErr));
        }

        function printReceipt() {
            let dataUrl = canvas.toDataURL("image/png");
            let base64Data = dataUrl.split(',')[1];
            window.location.href = "rawbt:data:image/png;base64," + base64Data;
            setTimeout(resetToHome, 2000);
        }

        function resetToHome() {
            showScreen('screen-home');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
